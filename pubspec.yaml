name: jenil_diamond
description: JENIL DIAMOND - Diamond karigar work and payment management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  telephony: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo .png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo .png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo .png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/logo .png"
  android: true
  ios: false

  android_12:
    color: "#FFFFFF"
    image: "assets/logo .png"

workflows:
  android-debug:
    name: JENIL DIAMOND Android APK
    max_build_duration: 30

    environment:
      flutter: stable
      android_signing:
        - jenil-release

    scripts:

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Create Android project
        script: |
          flutter create --platforms=android .

      - name: Set Android Compile SDK
        script: |
          echo "Setting Android Compile SDK..."

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i.bak \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i.bak \
              's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' \
              android/app/build.gradle

            sed -i.bak \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              android/app/build.gradle
          fi

          echo "Android Compile SDK set."

      - name: Fix Telephony Plugin
        script: |
          TELEPHONY_GRADLE="$HOME/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"

          if [ ! -f "$TELEPHONY_GRADLE" ]; then
            echo "ERROR: Telephony Gradle file not found"
            exit 1
          fi

          if ! grep -q "namespace" "$TELEPHONY_GRADLE"; then
            sed -i.bak '/android {/a\
                namespace "com.shounakmulay.telephony"
            ' "$TELEPHONY_GRADLE"
          fi

          sed -i.bak \
            's/compileSdkVersion 31/compileSdkVersion 36/g' \
            "$TELEPHONY_GRADLE"

          sed -i.bak \
            's/compileSdk 31/compileSdk 36/g' \
            "$TELEPHONY_GRADLE"

          sed -i.bak \
            's/compileSdk = 31/compileSdk = 36/g' \
            "$TELEPHONY_GRADLE"

          sed -i.bak \
            's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_11/g' \
            "$TELEPHONY_GRADLE"

          sed -i.bak -E \
            "s/jvmTarget[[:space:]]*=[[:space:]]*['\"]1\.8['\"]/jvmTarget = '11'/g" \
            "$TELEPHONY_GRADLE"

          if ! grep -q "jvmTarget.*11" "$TELEPHONY_GRADLE"; then
            cat >> "$TELEPHONY_GRADLE" <<'EOF'

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "11"
              }
          }
          EOF
          fi

      - name: Add SMS permission
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q "android.permission.SEND_SMS" "$MANIFEST"; then
            sed -i.bak '/<manifest/a\
              <uses-permission android:name="android.permission.SEND_SMS"/>
            ' "$MANIFEST"
          fi

          echo "SEND_SMS permission checked."

      - name: Configure Release Signing
        script: |
          echo "Configuring RELEASE signing..."

          APP_GRADLE="android/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: $APP_GRADLE not found"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          signing_block = '''
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword = System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias = "Key0"
                      keyPassword = System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''

          if 'create("release")' not in s:
              marker = "    buildTypes {"

              if marker not in s:
                  raise SystemExit("ERROR: buildTypes block not found")

              s = s.replace(
                  marker,
                  signing_block + marker,
                  1
              )

          old = 'signingConfig = signingConfigs.getByName("debug")'
          new = 'signingConfig = signingConfigs.getByName("release")'

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              marker = "        release {"

              if marker not in s:
                  raise SystemExit("ERROR: release block not found")

              s = s.replace(
                  marker,
                  marker + '\n            signingConfig = signingConfigs.getByName("release")',
                  1
              )

          p.write_text(s)

          print("Release signing configured.")
          print("Keystore alias: Key0")
          print("Keystore path variable: CM_KEYSTORE_PATH")
          PY

          echo "RELEASE SIGNING CONFIGURATION COMPLETE."

      - name: Clean Flutter
        script: |
          flutter clean
          flutter pub get

      - name: Verify Signing Configuration
        script: |
          echo "===== SIGNING CHECK ====="

          grep -n "signingConfigs" android/app/build.gradle.kts || true
          grep -n "keyAlias" android/app/build.gradle.kts || true
          grep -n "signingConfig" android/app/build.gradle.kts || true

          echo "========================="

      - name: Build Signed Release APK
        script: |
          flutter build apk --release

          echo "===== APK FILES ====="
          ls -lh build/app/outputs/flutter-apk/
          echo "===================="

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

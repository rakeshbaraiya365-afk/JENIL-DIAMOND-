workflows:
  android-debug:
    name: JENIL DIAMOND Android APK
    max_build_duration: 30

    environment:
      flutter: stable
      android_signing:
        - jenil-release

    scripts:

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Create Android project
        script: |
          flutter create --platforms=android .

      - name: Set Android Compile SDK
        script: |
          echo "Setting Android Compile SDK..."

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i.bak \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i.bak \
              's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' \
              android/app/build.gradle

            sed -i.bak \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              android/app/build.gradle
          fi

      - name: Fix Telephony Plugin
        script: |
          TELEPHONY_GRADLE="$HOME/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"

          if [ ! -f "$TELEPHONY_GRADLE" ]; then
            echo "ERROR: Telephony Gradle file not found"
            exit 1
          fi

          if ! grep -q "namespace" "$TELEPHONY_GRADLE"; then
            sed -i.bak '/android {/a\
                namespace "com.shounakmulay.telephony"
            ' "$TELEPHONY_GRADLE"
          fi

          sed -i.bak 's/compileSdkVersion 31/compileSdkVersion 36/g' "$TELEPHONY_GRADLE"
          sed -i.bak 's/compileSdk 31/compileSdk 36/g' "$TELEPHONY_GRADLE"
          sed -i.bak 's/compileSdk = 31/compileSdk = 36/g' "$TELEPHONY_GRADLE"
          sed -i.bak 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_11/g' "$TELEPHONY_GRADLE"

      - name: Add SMS permission
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q "android.permission.SEND_SMS" "$MANIFEST"; then
            sed -i.bak '/<manifest/a\
              <uses-permission android:name="android.permission.SEND_SMS"/>
            ' "$MANIFEST"
          fi

      - name: Configure Release Signing
        script: |
          echo "===== CONFIGURING RELEASE SIGNING ====="

          APP_GRADLE="android/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: $APP_GRADLE not found"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          signing_block = '''
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword = System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("CM_KEY_ALIAS")
                      keyPassword = System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''

          if 'create("release")' not in s:
              marker = "    buildTypes {"

              if marker not in s:
                  raise SystemExit("ERROR: buildTypes block not found")

              s = s.replace(marker, signing_block + marker, 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              marker = "        release {"

              if marker not in s:
                  raise SystemExit("ERROR: release block not found")

              s = s.replace(
                  marker,
                  marker + '\n            signingConfig = signingConfigs.getByName("release")',
                  1
              )

          p.write_text(s)
          PY

          echo "===== SIGNING CONFIGURATION ====="
          grep -n "create(\"release\")" android/app/build.gradle.kts || true
          grep -n "keyAlias" android/app/build.gradle.kts || true
          grep -n "signingConfig" android/app/build.gradle.kts || true
          echo "================================="

      - name: Clean Flutter
        script: |
          flutter clean
          flutter pub get

      - name: Build Signed Release APK
        script: |
          echo "===== BUILDING SIGNED RELEASE APK ====="

          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK CREATED: $APK"

          echo "===== VERIFY APK SIGNATURE ====="

          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "===== SIGNATURE VERIFICATION COMPLETE ====="

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  android-debug:
    name: JENIL DIAMOND Android APK
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Create Android project
        script: |
          flutter create --platforms=android .

      - name: Set Android Compile SDK
        script: |
          echo "Setting Android Compile SDK to 36"

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i.bak \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i.bak \
              's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' \
              android/app/build.gradle

            sed -i.bak \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              android/app/build.gradle
          fi

      - name: Fix Telephony Plugin
        script: |
          TELEPHONY_GRADLE="$HOME/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"

          if [ -f "$TELEPHONY_GRADLE" ]; then

            echo "Telephony file found"

            # Namespace
            if ! grep -q "namespace" "$TELEPHONY_GRADLE"; then
              sed -i.bak '/android {/a\
                  namespace "com.shounakmulay.telephony"
              ' "$TELEPHONY_GRADLE"
            fi

            # Compile SDK 36
            sed -i.bak \
              's/compileSdkVersion 31/compileSdkVersion 36/g' \
              "$TELEPHONY_GRADLE"

            sed -i.bak \
              's/compileSdk 31/compileSdk 36/g' \
              "$TELEPHONY_GRADLE"

            sed -i.bak \
              's/compileSdk = 31/compileSdk = 36/g' \
              "$TELEPHONY_GRADLE"

            # Java 11
            if ! grep -q "sourceCompatibility" "$TELEPHONY_GRADLE"; then
              sed -i.bak '/android {/a\
                  compileOptions {\
                      sourceCompatibility JavaVersion.VERSION_11\
                      targetCompatibility JavaVersion.VERSION_11\
                  }
              ' "$TELEPHONY_GRADLE"
            fi

            # Kotlin 11
            if ! grep -q "jvmTarget" "$TELEPHONY_GRADLE"; then
              sed -i.bak '/android {/a\
                  kotlinOptions {\
                      jvmTarget = "11"\
                  }
              ' "$TELEPHONY_GRADLE"
            fi

            echo "Telephony fixed: Java 11 + Kotlin 11 + SDK 36"

          else
            echo "ERROR: Telephony Gradle file not found"
            exit 1
          fi

      - name: Add SMS permission
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.SEND_SMS" "$MANIFEST"; then
              sed -i.bak '/<manifest/a\
              <uses-permission android:name="android.permission.SEND_SMS"/>
              ' "$MANIFEST"
            fi
          fi

      - name: Build APK
        script: |
          flutter clean
          flutter pub get
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

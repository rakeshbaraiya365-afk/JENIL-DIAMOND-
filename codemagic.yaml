workflows:
  android-debug:
    name: JENIL DIAMOND Android APK
    max_build_duration: 30

    environment:
      flutter: stable
      android_signing:
        - jenil-release

    scripts:

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Create Android project
        script: |
          flutter create --platforms=android .

      - name: Set Android Compile SDK
        script: |
          echo "Setting Android Compile SDK..."

          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Found app build.gradle.kts"

            sed -i.bak \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            echo "Found app build.gradle"

            sed -i.bak \
              's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' \
              android/app/build.gradle

            sed -i.bak \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              android/app/build.gradle
          fi

          echo "Android Compile SDK set."

      - name: Fix Telephony Plugin
        script: |
          TELEPHONY_GRADLE="$HOME/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"

          if [ ! -f "$TELEPHONY_GRADLE" ]; then
            echo "ERROR: Telephony Gradle file not found"
            exit 1
          fi

          if ! grep -q "namespace" "$TELEPHONY_GRADLE"; then
            sed -i.bak '/android {/a\
                namespace "com.shounakmulay.telephony"
            ' "$TELEPHONY_GRADLE"
          fi

          sed -i.bak \
            's/compileSdkVersion 31/compileSdkVersion 36/g' \
            "$TELEPHONY_GRADLE"

          sed -i.bak \
            's/compileSdk 31/compileSdk 36/g' \
            "$TELEPHONY_GRADLE"

          sed -i.bak \
            's/compileSdk = 31/compileSdk = 36/g' \
            "$TELEPHONY_GRADLE"

          sed -i.bak \
            's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_11/g' \
            "$TELEPHONY_GRADLE"

          sed -i.bak -E \
            "s/jvmTarget[[:space:]]*=[[:space:]]*['\"]1\.8['\"]/jvmTarget = '11'/g" \
            "$TELEPHONY_GRADLE"

          if ! grep -q "jvmTarget.*11" "$TELEPHONY_GRADLE"; then
            cat >> "$TELEPHONY_GRADLE" <<'EOF'

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "11"
              }
          }
          EOF
          fi

      - name: Add SMS permission
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            if ! grep -q "android.permission.SEND_SMS" "$MANIFEST"; then

              sed -i.bak '/<manifest/a\
              <uses-permission android:name="android.permission.SEND_SMS"/>
              ' "$MANIFEST"

              echo "SEND_SMS permission added."

            else
              echo "SEND_SMS permission already exists."
            fi

          else
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

      - name: Configure Release Signing
        script: |
          echo "Configuring Android release signing..."

          APP_GRADLE="android/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: android/app/build.gradle.kts not found"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          signing = '''
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword = System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("CM_KEY_ALIAS")
                      keyPassword = System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''

          marker = "    buildTypes {"

          if 'create("release")' not in s:
              if marker not in s:
                  raise SystemExit("ERROR: buildTypes block not found")

              s = s.replace(marker, signing + marker, 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1
          )

          p.write_text(s)
          PY

          echo "Release signing configuration added successfully."

      - name: Clean Flutter
        script: |
          flutter clean
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

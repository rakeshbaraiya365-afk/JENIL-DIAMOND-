workflows:
  android-debug:
    name: JENIL DIAMOND Android APK
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:

      - name: Generate Android project
        script: |
          flutter create --platforms=android .

      - name: Add SMS Permission
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.SEND_SMS" "$MANIFEST"; then
            sed -i.bak '/<application/i\
          <uses-permission android:name="android.permission.SEND_SMS"/>' "$MANIFEST"
          fi

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Fix Telephony Namespace
        script: |
          TELEPHONY_GRADLE="$HOME/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"

          if [ -f "$TELEPHONY_GRADLE" ]; then
            python3 - <<'PY'
from pathlib import Path

p = Path.home() / ".pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"
s = p.read_text()

if "namespace" not in s:
    s = s.replace(
        "android {",
        """android {
    namespace "com.shounakmulay.telephony"
""",
        1
    )

p.write_text(s)
PY
          fi

      - name: Fix Telephony JVM Target
        script: |
          TELEPHONY_GRADLE="$HOME/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"

          if [ -f "$TELEPHONY_GRADLE" ]; then
            python3 - <<'PY'
from pathlib import Path

p = Path.home() / ".pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"
s = p.read_text()

if "compileOptions" not in s:
    s = s.replace(
        "android {",
        """android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
""",
        1
    )

if "kotlinOptions" not in s:
    s += """

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "11"
    }
}
"""

p.write_text(s)
PY
          fi

      - name: Generate App Icon
        script: |
          dart run flutter_launcher_icons

      - name: Generate Splash Screen
        script: |
          dart run flutter_native_splash:create

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  android-debug:
    name: JENIL DIAMOND Android APK
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Create Android project
        script: |
          flutter create --platforms=android .

      - name: Set Android Compile SDK
        script: |
          echo "Checking Android files..."

          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Found build.gradle.kts"
            sed -i.bak 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            echo "Found build.gradle"
            sed -i.bak 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i.bak 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
          fi

          echo "Android compile SDK fixed."

      - name: Fix Telephony Plugin
        script: |
          TELEPHONY_GRADLE="$HOME/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"

          if [ -f "$TELEPHONY_GRADLE" ]; then
            echo "Found telephony plugin"

            # Add namespace
            if ! grep -q "namespace" "$TELEPHONY_GRADLE"; then
              sed -i.bak '/android {/a\
                  namespace "com.shounakmulay.telephony"
              ' "$TELEPHONY_GRADLE"
            fi

            # Fix compile SDK 31 -> 36
            sed -i.bak 's/compileSdkVersion 31/compileSdkVersion 36/g' "$TELEPHONY_GRADLE"
            sed -i.bak 's/compileSdk 31/compileSdk 36/g' "$TELEPHONY_GRADLE"
            sed -i.bak 's/compileSdk = 31/compileSdk = 36/g' "$TELEPHONY_GRADLE"

            # Fix Java/Kotlin JVM target
            sed -i.bak '/android {/a\
                compileOptions {\
                    sourceCompatibility JavaVersion.VERSION_11\
                    targetCompatibility JavaVersion.VERSION_11\
                }\
            ' "$TELEPHONY_GRADLE"

            echo "Telephony plugin fixed."
          else
            echo "Telephony gradle file not found."
          fi

      - name: Add SMS permission
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.SEND_SMS" "$MANIFEST"; then
              sed -i.bak '/<manifest/a\
              <uses-permission android:name="android.permission.SEND_SMS"/>
              ' "$MANIFEST"
            fi
          fi

      - name: Build APK
        script: |
          flutter clean
          flutter pub get
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
